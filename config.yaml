# ============================================================
# AutoCF V3 配置
# ============================================================

settings:

  # ----------------------------------------------------------
  # 自动运行时间
  # ----------------------------------------------------------

  schedule:
    timezone: "Asia/Shanghai"
    time: "01:00"


  # ----------------------------------------------------------
  # 最终每地区保留多少节点
  # ----------------------------------------------------------

  top_nodes: 3


  # ----------------------------------------------------------
  # 每个 IP 稳定性测试次数
  # ----------------------------------------------------------

  test_rounds: 5


  # ----------------------------------------------------------
  # 单次测试最大等待时间
  # ----------------------------------------------------------

  timeout_seconds: 8


  # ----------------------------------------------------------
  # 最低下载速度
  # 低于这个速度直接淘汰
  # ----------------------------------------------------------

  min_download_mbps: 5


  # ----------------------------------------------------------
  # 下载测速文件大小
  # 524288 = 512 KB
  # ----------------------------------------------------------

  download_bytes: 524288


  # ----------------------------------------------------------
  # 同时测试多少个 IP
  # ----------------------------------------------------------

  concurrency: 20


  # ----------------------------------------------------------
  # 综合评分权重
  # ----------------------------------------------------------

  weights:

    latency: 0.30

    download: 0.45

    stability: 0.25


# ============================================================
# V3：候选 IP 池
# ============================================================

candidate_pool:

  # Cloudflare 每个 IPv4 网段随机生成多少 IP
  #
  # 第一次测试使用 50
  #
  # 15 个官方网段大约：
  # 15 × 50 = 750 IP
  #
  # 确认程序正常以后可以改成 200
  # 约 3000 IP

  ips_per_cidr: 50


  # ----------------------------------------------------------
  # 第一阶段快速探测并发
  # ----------------------------------------------------------

  probe_workers: 30


  # ----------------------------------------------------------
  # TCP / TLS / HTTP 快速探测超时
  # ----------------------------------------------------------

  probe_timeout: 3


  # ----------------------------------------------------------
  # 每个地区进入精测的候选数量
  # ----------------------------------------------------------

  region_top_n: 20


  # ----------------------------------------------------------
  # 最终每地区输出数量
  # ----------------------------------------------------------

  final_top_n: 3


  # ----------------------------------------------------------
  # 稳定性测试次数
  # ----------------------------------------------------------

  stability_rounds: 3


  # ----------------------------------------------------------
  # 稳定性测试间隔
  # ----------------------------------------------------------

  stability_interval: 1


  # ----------------------------------------------------------
  # 最低稳定成功率
  #
  # 0.67 = 至少 67% 成功
  # ----------------------------------------------------------

  min_success_rate: 0.67


# ============================================================
# Cloudflare 探测
# ============================================================

probe:

  # Cloudflare TLS / HTTP 测试 Host
  host: "cloudflare.com"

  port: 443


# ============================================================
# 地区识别
