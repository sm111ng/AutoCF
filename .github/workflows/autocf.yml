name: AutoCF Automatic IP Selector

on:
  workflow_dispatch:
  schedule:
    - cron: "0 17 * * *"

permissions:
  contents: write


env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8


jobs:

  autocf:

    runs-on: windows-latest


    steps:


      - name: Checkout repository
        uses: actions/checkout@v4



      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"



      - name: Install dependencies
        shell: powershell
        run: |

          python -m pip install --upgrade pip

          pip install aiohttp pyyaml requests



      - name: Download subscription
        shell: powershell
        env:
          SUBSCRIPTION_URL: ${{ secrets.SUBSCRIPTION_URL }}

        run: |

          $ErrorActionPreference = "Stop"


          if ([string]::IsNullOrWhiteSpace($env:SUBSCRIPTION_URL)) {

            throw "SUBSCRIPTION_URL missing"

          }


          Invoke-WebRequest `
            -Uri $env:SUBSCRIPTION_URL `
            -OutFile ".\subscription_raw.txt"



          $raw = Get-Content `
            ".\subscription_raw.txt" `
            -Raw



          if ($raw -match "vless://") {


            $raw | Set-Content `
              ".\decoded_sub.txt" `
              -Encoding UTF8


          }
          else {


            $clean = $raw -replace "\s",""


            $bytes = [Convert]::FromBase64String($clean)


            $decoded = [Text.Encoding]::UTF8.GetString($bytes)



            if ($decoded -notmatch "vless://") {

              throw "Invalid VLESS subscription"

            }


            $decoded | Set-Content `
              ".\decoded_sub.txt" `
              -Encoding UTF8

          }



          $count = (

            Get-Content ".\decoded_sub.txt" |

            Where-Object {
              $_ -match "^vless://"
            }

          ).Count



          Write-Host "VLESS nodes: $count"



          if ($count -eq 0) {

            throw "No VLESS nodes"

          }




      - name: Run scanner
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"


          python -X utf8 .\scanner.py



          if ($LASTEXITCODE -ne 0) {

            throw "scanner failed"

          }




      - name: Run VLESS test
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"


          python -X utf8 .\vless_real_test.py



          if ($LASTEXITCODE -ne 0) {

            throw "vless test failed"

          }




      - name: Stability test
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"


          Write-Host "=============================="
          Write-Host "STABILITY TEST"
          Write-Host "=============================="


          python -X utf8 .\stability.py



          if ($LASTEXITCODE -ne 0) {

            throw "stability failed"

          }



          if (!(Test-Path ".\results\stability_nodes.json")) {

            throw "stability_nodes.json missing"

          }



          Write-Host "stability_nodes.json OK"





      - name: Final selector
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"


          python -X utf8 .\final_selector.py



          if ($LASTEXITCODE -ne 0) {

            throw "final_selector failed"

          }




      - name: Prepare public output
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"



          New-Item `
            -ItemType Directory `
            -Force `
            ".\public" |
            Out-Null



          Copy-Item `
            ".\output\FINAL_subscription.txt" `
            ".\public\subscription.txt" `
            -Force



          Copy-Item `
            ".\output\FINAL_nodes.txt" `
            ".\public\nodes.txt" `
            -Force



          Copy-Item `
            ".\output\FINAL_summary.txt" `
            ".\public\summary.txt" `
            -Force




      - name: Commit output
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"


          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"



          git add public



          $changes = git status --porcelain



          if ($changes) {


            git commit -m "AutoCF update nodes"

            git push


          }
          else {

            Write-Host "No changes"

          }