name: AutoCF Automatic IP Selector

on:
  workflow_dispatch:
  schedule:
    - cron: "0 17 * * *"

permissions:
  contents: write


env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8


jobs:

  autocf:

    runs-on: windows-latest


    steps:


      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"



      - name: Install dependencies
        shell: powershell
        run: |

          python -m pip install --upgrade pip

          pip install aiohttp pyyaml requests



      - name: Download Xray
        shell: powershell
        run: |

          $ErrorActionPreference="Stop"

          Write-Host "Downloading Xray"


          $release = Invoke-RestMethod `
          https://api.github.com/repos/XTLS/Xray-core/releases/latest


          $asset = $release.assets |
          Where-Object {
            $_.name -eq "Xray-windows-64.zip"
          }


          Invoke-WebRequest `
          $asset.browser_download_url `
          -OutFile xray.zip


          Expand-Archive `
          xray.zip `
          -DestinationPath xray_tmp `
          -Force


          Copy-Item `
          (Get-ChildItem xray_tmp -Filter xray.exe -Recurse).FullName `
          xray.exe



      - name: Download subscription
        shell: powershell
        env:

          SUBSCRIPTION_URL: ${{ secrets.SUBSCRIPTION_URL }}

        run: |

          $ErrorActionPreference="Stop"


          Invoke-WebRequest `
          $env:SUBSCRIPTION_URL `
          -OutFile subscription_raw.txt


          $raw = Get-Content subscription_raw.txt -Raw


          if($raw -match "vless://"){

            $raw |
            Set-Content decoded_sub.txt -Encoding UTF8

          }

          else{

            $bytes=[Convert]::FromBase64String(
            ($raw -replace "\s","")
            )


            [Text.Encoding]::UTF8.GetString($bytes) |
            Set-Content decoded_sub.txt -Encoding UTF8

          }



      # ===============================
      # 1 HTTPS扫描
      # ===============================

      - name: Run scanner
        shell: powershell

        run: |

          python -X utf8 scanner.py



      # ===============================
      # 2 VLESS真实测试
      # ===============================

      - name: Run VLESS test
        shell: powershell

        run: |

          python -X utf8 vless_real_test.py



      # ===============================
      # 3 节点评分
      # ===============================

      - name: Score nodes
        shell: powershell

        run: |

          python -X utf8 scorer.py


          if (!(Test-Path ".\results\scored_nodes.json")) {

            throw "scored_nodes.json missing"

          }



      # ===============================
      # 4 稳定性测试
      # ===============================

      - name: Stability test
        shell: powershell

        run: |

          python -X utf8 stability.py


          if (!(Test-Path ".\results\stability_nodes.json")) {

            throw "stability_nodes.json missing"

          }




      # ===============================
      # 5 最终选择
      # ===============================

      - name: Final selector
        shell: powershell

        run: |

          python -X utf8 final_selector.py



      # ===============================
      # 6 输出
      # ===============================

      - name: Prepare public

        shell: powershell

        run: |


          New-Item `
          public `
          -ItemType Directory `
          -Force


          Copy-Item `
          output\FINAL_subscription.txt `
          public\subscription.txt `
          -Force


          Copy-Item `
          output\FINAL_nodes.txt `
          public\nodes.txt `
          -Force


          Copy-Item `
          output\FINAL_summary.txt `
          public\summary.txt `
          -Force



      - name: Commit output

        shell: powershell

        run: |


          git config user.name github-actions[bot]

          git config user.email 41898282+github-actions[bot]@users.noreply.github.com


          git add public


          git commit -m "AutoCF update nodes" || echo no changes


          git push